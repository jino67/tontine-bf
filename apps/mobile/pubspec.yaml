name: app_tontine_bf
description: "Application mobile Tontine BF : suivi des tontines et des cotisations."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.3.4
  crypto: ^3.0.7
  google_fonts: ^8.1.0
  qr_flutter: ^4.1.0
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    # Polices embarquées : google_fonts les trouve par leur nom de fichier, sans téléchargement.
    - assets/google_fonts/
